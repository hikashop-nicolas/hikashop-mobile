name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a release asset

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Includes the accessibility checks that need no shop: the palette's contrast ratios,
      # computed from the tokens, and what a screen reader would announce, through the virtual
      # one. The browser audit (npm run a11y) and the end-to-end suite both drive a real shop,
      # so they stay a local and pre-release gate; see docs/accessibility.md.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # Its default also asks for the retired 'tools' package, which sdkmanager 16 no longer has.
          packages: platform-tools

      # Pin what the build actually asks for rather than trusting the runner image to keep
      # shipping it; see android/variables.gradle.
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # A signed APK (sideload) and AAB (Play Console) when the keystore secrets are set;
      # otherwise a debug APK, so the build keeps working before signing is configured.
      # Nothing secret is committed: the keystore arrives base64-encoded from repo secrets.
      - name: Build APK, and the AAB when signing is configured
        id: build
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # The run number keeps every Play upload unique and increasing.
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../hikashop.apk
            cp app/build/outputs/bundle/release/app-release.aab ../hikashop.aab
            echo "kind=signed release" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../hikashop.apk
            echo "kind=debug (no signing secrets set)" >> "$GITHUB_OUTPUT"
          fi

      # A permanent download link for the APK. Workflow artifacts expire and need a GitHub
      # login, which makes them useless for handing a build to a beta tester.
      - name: Publish rolling release (APK for sideload)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Latest Android APK
          prerelease: true
          files: hikashop.apk
          body: |
            Android APK built automatically from the latest `main` (${{ steps.build.outputs.kind }}).
            Sideload it to try the HikaShop app; Android will warn about installing from an
            unknown source.

      # The AAB is what the Play Console accepts. Download it from this run with:
      #   gh run download <run-id> -n play-aab
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.kind == 'signed release'
        with:
          name: play-aab
          path: hikashop.aab
          retention-days: 60
